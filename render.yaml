# Render blueprint for Chunian Ride (free tier).
# In Render: New -> Blueprint -> connect the repo containing this file.
services:
  - type: web
    name: chunian-ride
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false # optional — set for persistent data, e.g. libsql://chunian-ride-xxx.turso.io; unset = local SQLite file (resets on redeploy/restart)
      - key: TURSO_AUTH_TOKEN
        sync: false # optional — Turso auth token (secret); only needed with TURSO_DATABASE_URL
      - key: ADMIN_PIN
        sync: false # owner admin PIN for the Admin tab; CHANGE the default "1234" here
      - key: NODE_VERSION
        value: "22.23.4"
